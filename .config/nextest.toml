# A test that hangs fails instead of blocking the run.
[profile.default]
slow-timeout = { period = "20s", terminate-after = 3 }
# No test leaves a child process behind. On a busy machine the pipes of a test that has exited can still need more
# than the default 200ms to close. nextest then flags it as leaky.
leak-timeout = "1s"

# Tests that compile crates of their own.
[[profile.default.overrides]]
filter = 'test(=tests::generated_crates::wasm_client) | test(=tests::generated_crates::an_any_of_tie_keeps_every_member_with_keep_unknown_properties) | test(=tests::generated_crates::a_server_for_some_operations_holds_the_types_they_reach) | test(=tests::generated_crates::declared_security_needs_a_verify_method) | test(=tests::generated_crates::security_shapes_compile) | test(=tests::fuzz::generated_crates_compile_and_pass_their_tests) | test(=tests::generated_crates::library_types_read_only_their_format) | test(=tests::generated_crates::library_types_in_requests_read_only_their_format) | test(=tests::schema_suite::generated_types_follow_the_json_schema_test_suite)'
slow-timeout = { period = "300s", terminate-after = 4 }
