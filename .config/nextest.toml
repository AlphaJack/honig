# A test that hangs fails instead of holding up the run.
[profile.default]
slow-timeout = { period = "20s", terminate-after = 3 }
# No test leaves a child process behind. On a busy machine the pipes of a test that has exited can still take more
# than the default 200ms to close. nextest then flags it as leaky.
leak-timeout = "1s"

# Tests that compile crates of their own.
[[profile.default.overrides]]
filter = 'test(=tests::generated_crates::wasm_client) | test(=tests::fuzz::generated_crates_compile_and_pass_their_tests) | test(=tests::generated_crates::library_types_read_only_their_format)'
slow-timeout = { period = "300s", terminate-after = 4 }
