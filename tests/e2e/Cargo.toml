[package]
name = "e2e"
description = "Every fixture description in tests/fixtures, generated as one module each, with hand-written tests"
version = "0.0.0"
edition = "2024"
publish = false

# No `workspace = true`. Generated code is checked with the default lints as in the crate of a user.
[lints]

[lib]
doctest = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `format: uri` as `url::Url`. `ipv4-cidr` and `ipv6-cidr` as `ipnet` networks.
url = { version = "2", default-features = false, features = ["std", "serde"] }
ipnet = { version = "2", default-features = false, features = ["serde"] }
# Optional adapters: each feature also turns on its `honig` feature.
reqwest = { version = "0.13", optional = true, default-features = false, features = ["rustls"] }
axum = { version = "0.8", optional = true, default-features = false }
ureq = { version = "3", optional = true, default-features = false }
reqwest-middleware = { version = "0.5", optional = true }
honig = { version = "=0.0.1", features = ["client", "server", "base64", "cookie", "idn", "multipart", "oauth", "pkce", "regress", "xml", "simd"], path = "../../runtime" }

[features]
# On by default so that the tests of the workspace serve and call through them. Optional so that the generated
# code is built against adapters behind features.
default = ["reqwest", "reqwest-middleware", "ureq", "axum"]
reqwest = ["dep:reqwest", "honig/reqwest"]
reqwest-middleware = ["reqwest", "dep:reqwest-middleware", "honig/reqwest-middleware"]
ureq = ["dep:ureq", "honig/ureq"]
axum = ["dep:axum", "honig/axum"]

[dev-dependencies]
# `tests/v32_catalog`: the recipes of the book with tower and tower-http layers and hyper as the server.
tower = { version = "0.5", default-features = false, features = ["util", "limit", "load-shed", "timeout", "filter"] }
tower-http = { version = "0.7", default-features = false, features = ["cors"] }
# The web app recipe: its files compiled into the binary, each with the content type of its extension. Debug builds
# embed them too, so the tests run what a release ships.
rust-embed = { version = "8", features = ["mime-guess", "debug-embed"] }
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "service"] }
# `tests/v32_catalog/adapters.rs`: retries and an HTTP cache through the reqwest-middleware stack. Only 1.0 builds on
# reqwest 0.13. It is still an alpha. `moka` keeps the cache in memory.
reqwest-retry = "0.9"
http-cache-reqwest = { version = "=1.0.0-alpha.11", default-features = false, features = ["manager-moka", "url-standard", "reqwest-middleware"] }
async-trait = "0.1"
http = "1"
# `tests/v32_uploads.rs` sends a body in frames.
http-body = "1"
bytes = "1"
http-body-util = "0.1"
# `tests/v32_kitchen_sink.rs`: requests that break the description. A failure shrinks to the smallest one.
proptest = { version = "1", default-features = false, features = ["std"] }
lambda_http = { version = "1.3.2", default-features = false, features = ["apigw_rest", "apigw_http"] }
# `tests/v32_catalog` serves and calls over a socket.
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "json", "form", "multipart"] }
# `tests/v32_catalog/websocket.rs` talks to the WebSocket route beside the generated one.
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# `gate`: the hand-rolled twins of the generated paths that the allocation and time gates compare with.
quick-xml = { version = "0.42", features = ["serialize"] }
regex = "1"
base64 = "0.23"
# `tests/v32_catalog/observability.rs`: spans exported through OpenTelemetry carry a trace across a request.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
tracing-opentelemetry = { version = "0.34", default-features = false }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
honig = { version = "=0.0.1", path = "../../runtime", features = ["tracing", "tracing-opentelemetry"] }

# The PR gate on the cost of a request: generated paths against hand-rolled twins.
[[bench]]
name = "time_gate"
harness = false

# How the cost of a request grows with its payload, against the hand-rolled twins: `tests/e2e/cost`.
[[bench]]
name = "size_sweep"
harness = false
