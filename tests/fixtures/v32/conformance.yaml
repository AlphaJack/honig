openapi: 3.2.0
info: {title: Conformance, version: "1"}
security: [{bearer: []}]
components:
  securitySchemes:
    bearer: {type: http, scheme: Bearer}
    cookieKey: {type: apiKey, in: cookie, name: SID}
  schemas:
    Closed:
      type: object
      properties: {a: {type: string}}
      additionalProperties: false
    Product:
      type: object
      required: [kind]
      properties: {kind: {type: string}}
      discriminator: {propertyName: kind}
      oneOf: [{$ref: "#/components/schemas/Gadget"}, {$ref: "#/components/schemas/Book"}]
    # Each branch fixes its tag: a value matches exactly one, as `oneOf` requires.
    Gadget: {type: object, required: [kind], properties: {kind: {const: Gadget}, purrs: {type: boolean}}}
    Book: {type: object, required: [kind], properties: {kind: {const: Book}, barks: {type: boolean}}}
paths:
  /public:
    get:
      operationId: open
      security: []
      responses: {"204": {description: ok}}
  /inherits:
    get:
      operationId: inherits
      responses: {"204": {description: ok}}
  /ping:
    get:
      operationId: ping
      security: []
      responses: {"2XX": {description: any success}}
  /items/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: limit, in: query, schema: {type: string}}
    get:
      operationId: getItem
      parameters:
        - {name: limit, in: query, schema: {type: integer}}
      responses:
        "2XX": {description: any success, content: {application/json: {schema: {type: string}}}}
        default: {description: error, content: {application/json: {schema: {type: object}}}}
  /closed:
    post:
      operationId: postClosed
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/Closed"}}}
      responses: {"204": {description: ok}}
  /optional-body:
    post:
      operationId: optionalBody
      requestBody:
        content: {application/json: {schema: {type: object}}}
      responses: {"204": {description: ok}}
  /products:
    post:
      operationId: postProduct
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/Product"}}}
      responses: {"204": {description: ok}}
  /upload:
    post:
      operationId: upload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name: {type: string}
                count: {type: integer}
                meta: {type: object, properties: {x: {type: integer}}}
                file: {type: string, contentMediaType: image/png}
                tags: {type: array, items: {type: string}}
      responses: {"204": {description: ok}}
  /cookies:
    get:
      operationId: cookies
      security: [{cookieKey: []}]
      responses:
        "204":
          description: ok
          headers:
            Set-Cookie: {schema: {type: array, items: {type: string}}}
  /filter:
    get:
      operationId: filter
      parameters:
        - {name: where, in: query, style: form, explode: true, schema: {$ref: "#/components/schemas/Closed"}}
        - {name: page, in: query, schema: {type: integer}}
      responses: {"204": {description: ok}}
