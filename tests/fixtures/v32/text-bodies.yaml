openapi: 3.2.0
info: {title: Text bodies, version: "1"}
paths:
  # A text body with limits: the server decodes it through the type of its schema and answers 400 outside them.
  /notes:
    post:
      operationId: addNote
      requestBody:
        required: true
        content:
          text/plain: {schema: {type: string, maxLength: 5}}
      responses:
        "200":
          description: The note in capitals.
          headers:
            X-Count: {description: Notes so far., content: {application/json: {schema: {type: integer}}}}
          content:
            text/plain: {schema: {type: string, pattern: '^[^a-z]*$'}}
  /moods:
    put:
      operationId: setMood
      requestBody:
        required: true
        content:
          text/plain: {schema: {type: string, enum: [calm, loud]}}
      responses:
        "204": {description: Set.}
