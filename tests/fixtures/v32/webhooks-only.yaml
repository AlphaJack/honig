openapi: 3.2.0
info: {title: Webhooks only, version: "1", description: An API that only sends webhooks; it has no paths and no security.}
webhooks:
  orderShipped:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Shipment'}
      responses:
        "204": {description: Received.}
components:
  schemas:
    Shipment:
      type: object
      required: [orderId]
      properties:
        orderId: {type: string}
        carrier: {type: string}
