openapi: 3.2.0
info: {title: Lenient client, version: "1"}
# `lenient.toml` sets `client = { strict = false }`: responses read what the server added, requests stay strict.
paths:
  /orders/{id}:
    get:
      operationId: getOrder
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200":
          description: The order.
          content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}
  /orders:
    post:
      operationId: putOrder
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}
      responses:
        "204": {description: Stored.}
components:
  schemas:
    Order:
      type: object
      required: [id, status]
      additionalProperties: false
      properties:
        id: {type: string}
        status: {$ref: '#/components/schemas/Status'}
        priority: {type: integer, enum: [1, 2, 3]}
        payment: {$ref: '#/components/schemas/Payment'}
        note: {$ref: '#/components/schemas/Note'}
    Status:
      type: string
      enum: [open, closed]
    # Tagged: a `kind` that the server added reads as `Other`.
    Payment:
      oneOf: [{$ref: '#/components/schemas/Card'}, {$ref: '#/components/schemas/Bank'}]
      discriminator: {propertyName: kind, mapping: {card: '#/components/schemas/Card', bank: '#/components/schemas/Bank'}}
    Card:
      type: object
      required: [kind, last4]
      properties: {kind: {type: string}, last4: {type: string}}
    Bank:
      type: object
      required: [kind, iban]
      properties: {kind: {type: string}, iban: {type: string}}
    # Untagged: a shape that no branch takes reads as `Other`.
    Note:
      oneOf: [{type: string}, {type: object, required: [text], properties: {text: {type: string}}, additionalProperties: false}]
