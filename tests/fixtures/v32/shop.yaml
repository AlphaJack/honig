openapi: 3.2.0
# Refs inside an `$id` resolve against that `$id` (JSON Schema): they refer to this document by its base.
$self: https://shop.example.com/openapi.yaml
info:
  title: Shop
  description: |
    A product catalog with accounts, orders, photos and event streams. Every description is Markdown, and the
    generated rustdoc keeps it.

    ## Markdown

    Descriptions *can* hold ~~plain text~~ **Markdown**: [links](https://example.com/docs), lists and code.

    <details>
      <summary>Examples</summary>

      **Blockquotes**

      > Ships in two days.

      **Tables**

      | Feature  | Availability |
      | -------- | ------------ |
      | Tables   | yes          |

      **Accordion**

      ```html
      <details>
        <summary>Using Details Tags</summary>
        <p>HTML Example</p>
      </details>
      ```

      **Images**

      ![Product photo placeholder](https://example.com/photo.png)

      **Alerts**

      > [!tip]
      > Descriptions can hold Markdown alerts.

    </details>
  version: 1.0.0
  contact:
    name: Shop Support
    url: https://example.com/support
    email: support@example.com
  license:
    name: MIT
    url: https://opensource.org/license/MIT
externalDocs:
  description: Documentation
  url: https://example.com/docs
servers:
  - url: https://shop.example.com
    name: production
  - url: '{protocol}://echo.example.com/{path}'
    name: mirror
    description: Responds with your request data
    variables:
      protocol:
        enum:
          - https
          - http
        default: https
      path:
        default: ''
security:
  - bearerAuth: []
  - basicAuth: []
  - apiKeyQuery: []
  - apiKeyHeader: []
  - apiKeyHeader: []
    apiKeyQuery: []
  - apiKeyCookie: []
  - oAuth2: []
  - openIdConnect: []
tags:
  - name: Authentication
    summary: Accounts and tokens
    kind: nav
    description: Some endpoints are public, but some require authentication. We
      provide all the required endpoints to create an account and authorize
      yourself.
  - name: Items
    summary: Everything for sale
    kind: nav
    description: Items are the products and variants in the shop.
  - name: Products
    summary: What the shop sells
    kind: nav
    parent: Items
    description: Everything about products
  - name: Streaming
    summary: Real-time shop feeds
    kind: nav
    description: Server-sent events and sequential JSON streams of shop activity.
  - name: Beta
    summary: Experimental endpoints
    kind: badge
    description: Endpoints that are still experimental and may change without notice.
  - name: Partners
    summary: Partner-only operations
    kind: audience
    description: Operations intended for integration partners rather than the public API.
paths:
  /products:
    get:
      tags:
        - Products
      summary: Get all products
      description:
        Retrieve every product in the catalog, a page at a time.
      operationId: getAllData
      security: []
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: OK
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Pagination-Total:
              $ref: '#/components/headers/X-Pagination-Total'
            X-Pagination-Page:
              $ref: '#/components/headers/X-Pagination-Page'
            X-Pagination-Per-Page:
              $ref: '#/components/headers/X-Pagination-Per-Page'
            X-Cache-Control:
              $ref: '#/components/headers/X-Cache-Control'
          content:
            application/json:
              schema:
                $id: 'https://shop.example.com/schemas/PaginatedProducts'
                $defs:
                  itemType:
                    $dynamicAnchor: itemType
                    $ref: 'https://shop.example.com/openapi.yaml#/components/schemas/Product'
                $ref: 'https://shop.example.com/openapi.yaml#/components/schemas/PaginatedResource'
            application/xml:
              schema:
                $id: 'https://shop.example.com/schemas/PaginatedProductsXml'
                xml:
                  name: products
                $defs:
                  itemType:
                    $dynamicAnchor: itemType
                    $ref: 'https://shop.example.com/openapi.yaml#/components/schemas/Product'
                $ref: 'https://shop.example.com/openapi.yaml#/components/schemas/PaginatedResource'
          links:
            GetFirstProduct:
              operationId: getProduct
              description: Retrieve the first product when the response contains at least one product.
              parameters:
                path.productId: '$response.body#/data/0/id'
            FirstPage:
              operationId: getAllData
              description: Return to the first page using the requested page size.
              parameters:
                query.limit: '$request.query.limit'
                query.offset: '0'
    post:
      tags:
        - Products
      summary: Create a product
      description:
        Add a product to the catalog.
      operationId: createProduct
      callbacks:
        productCreated:
          '{$request.body#/successCallbackUrl}':
            post:
              security: []
              requestBody:
                description: Information about the newly created product
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/Product'
              responses:
                '200':
                  description: Your server returns this code if it accepts the callback
                '204':
                  description:
                    Your server should return this HTTP status code if no longer
                    interested in further updates
        productCreationFailed:
          '{$request.body#/failureCallbackUrl}':
            post:
              security: []
              requestBody:
                description: Information about which fields failed to validate
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/Product'
              responses:
                '200':
                  description: Your server returns this code if it accepts the failure callback notification
        productDiscontinued:
          '{$request.body#/successCallbackUrl}':
            post:
              security: []
              requestBody:
                description: Information about the newly discontinued product
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/Product'
              responses:
                '200':
                  description: Your server returns this code if it accepts the discontinued product callback notification
      requestBody:
        description: Product
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
          application/xml:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: Created
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Location:
              $ref: '#/components/headers/Location'
            X-Processing-Time:
              $ref: '#/components/headers/X-Processing-Time'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
            application/xml:
              schema:
                $ref: '#/components/schemas/Product'
          links:
            GetProduct:
              $ref: '#/components/links/GetProduct'
            UpdateProduct:
              operationRef: '#/paths/~1products~1%7BproductId%7D/put'
              description: Update the created product using its ID and response body.
              parameters:
                productId: '$response.body#/id'
              requestBody: '$response.body'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    query:
      tags:
        - Products
      summary: Query products
      description:
        Search the product catalog by sending a query payload with the HTTP QUERY
        method (new in OpenAPI 3.2). QUERY is safe and idempotent like GET, but
        accepts a request body so you can express richer filters than a URL query
        string allows.
      operationId: queryProducts
      security: []
      requestBody:
        description: The query to run against the product catalog
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductQuery'
      responses:
        '200':
          description: Matching products
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $id: 'https://shop.example.com/schemas/QueriedProducts'
                $defs:
                  itemType:
                    $dynamicAnchor: itemType
                    $ref: 'https://shop.example.com/openapi.yaml#/components/schemas/Product'
                $ref: 'https://shop.example.com/openapi.yaml#/components/schemas/PaginatedResource'
        '400':
          $ref: '#/components/responses/BadRequest'
  /products/search:
    get:
      tags:
        - Products
      summary: Search products with a structured query string
      description:
        Filter products using a single, structured query string. The `filter`
        parameter sets `in` to `querystring` (new in OpenAPI 3.2), which describes
        the entire query string as one value via a media type instead of listing
        each query parameter individually.
      operationId: searchProducts
      security: []
      parameters:
        - name: filter
          in: querystring
          description: The complete query string, encoded as JSON, describing the filter to apply.
          required: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductQuery'
      responses:
        '200':
          description: Matching products
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $id: 'https://shop.example.com/schemas/SearchedProducts'
                $defs:
                  itemType:
                    $dynamicAnchor: itemType
                    $ref: 'https://shop.example.com/openapi.yaml#/components/schemas/Product'
                $ref: 'https://shop.example.com/openapi.yaml#/components/schemas/PaginatedResource'
  /products/{productId}:
    get:
      tags:
        - Products
      summary: Get a product
      description:
        One product, by its ID.
      operationId: getProduct
      security: []
      parameters:
        - $ref: '#/components/parameters/productId'
        - $ref: '#/components/parameters/ifNoneMatch'
      responses:
        '200':
          description: Product Found
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/Last-Modified'
            X-Cache-Control:
              $ref: '#/components/headers/X-Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
            application/xml:
              schema:
                $ref: '#/components/schemas/Product'
          links:
            DeleteProduct:
              operationId: deleteProduct
              description: Delete this product using the ID from the request path.
              parameters:
                productId: '$request.path.productId'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Products
      summary: Update a product
      description: Change the details of a product.
      operationId: updateProduct
      requestBody:
        description: New information about the product
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
          application/xml:
            schema:
              $ref: '#/components/schemas/Product'
      parameters:
        - $ref: '#/components/parameters/productId'
        - $ref: '#/components/parameters/ifMatch'
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
            application/xml:
              schema:
                $ref: '#/components/schemas/Product'
          links:
            GetProduct:
              $ref: '#/components/links/GetProduct'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          description: The product changed since the client read it
    delete:
      tags:
        - Products
      summary: Delete a product
      operationId: deleteProduct
      description: Deprecated, since deleting a product breaks its open orders.
      parameters:
        - $ref: '#/components/parameters/productId'
      responses:
        '204':
          description: No Content
        '404':
          $ref: '#/components/responses/NotFound'
    additionalOperations:
      COPY:
        tags:
          - Products
          - Partners
        summary: Copy a product
        description:
          Duplicate an existing product using the WebDAV-style COPY method. This
          demonstrates how OpenAPI 3.2 describes custom HTTP methods.
        operationId: copyProduct
        parameters:
          - $ref: '#/components/parameters/productId'
          - name: Destination
            in: header
            required: true
            description: The location where the copied product should be created
            schema:
              type: string
              format: uri-reference
              examples:
                - /products/999
        responses:
          '201':
            description: Product copied
            headers:
              Location:
                $ref: '#/components/headers/Location'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Product'
            links:
              GetProduct:
                $ref: '#/components/links/GetProduct'
          '404':
            $ref: '#/components/responses/NotFound'
  /products/{productId}/image:
    post:
      tags:
        - Products
      summary: Upload an image to a product
      description: Upload a photo of a product.
      operationId: uploadImage
      parameters:
        - $ref: '#/components/parameters/productId'
      requestBody:
        description: Image to upload
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: The image file to upload
                  examples:
                    - '@front.jpg'
                    - '@back.png'
      responses:
        '200':
          $ref: '#/components/responses/ImageUploaded'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /products/events:
    get:
      tags:
        - Streaming
        - Beta
      summary: Stream product events
      description:
        Subscribe to a live feed of product changes. The response is an open stream
        rather than a single document, so each media type uses `itemSchema` (new in
        OpenAPI 3.2) to describe one event at a time. Server-Sent Events
        (`text/event-stream`), JSON Lines (`application/jsonl`) and JSON Text
        Sequences (`application/json-seq`) are all offered.
      operationId: streamProductEvents
      security: []
      parameters:
        - name: Last-Event-ID
          in: header
          description: The `id` of the last event the client read, to resume after it when it reconnects.
          schema:
            type: string
      responses:
        '200':
          description: An open stream of product events
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            text/event-stream:
              itemSchema:
                $ref: '#/components/schemas/ProductEvent'
            application/jsonl:
              itemSchema:
                $ref: '#/components/schemas/ProductEvent'
            application/json-seq:
              itemSchema:
                $ref: '#/components/schemas/ProductEvent'
  /products/{productId}/photos:
    post:
      tags:
        - Products
        - Beta
      summary: Upload a batch of photos
      description:
        Send a mixed multipart stream of one metadata part, then any number of image
        parts. `prefixEncoding` describes the leading, fixed parts and
        `itemEncoding` applies to every repeated item that follows.
      operationId: uploadPhotos
      parameters:
        - $ref: '#/components/parameters/productId'
      requestBody:
        required: true
        content:
          multipart/mixed:
            schema:
              type: array
              prefixItems:
                - $ref: '#/components/schemas/PhotoBatchMeta'
              items:
                type: string
                format: binary
                description: A captured image, one per remaining part
            prefixEncoding:
              - contentType: application/json
            itemEncoding:
              contentType: image/jpeg
      responses:
        '202':
          description: Photos accepted for processing
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: integer
                    description: Number of photo parts accepted
                    examples:
                      - 12
                  batchId:
                    type: string
                    format: uuid
                    examples:
                      - 8f47c132-9d1f-4f83-b5a4-91db5ee757ab
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /items:
    post:
      tags:
        - Items
      summary: Create an item
      description: Add a product or a variant, anything the shop sells.
      operationId: createItem
      requestBody:
        description: Item to create
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Item'
      responses:
        '201':
          description: Item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
  /user/signup:
    post:
      tags:
        - Authentication
      summary: Create a user
      description: Create a user account.
      operationId: createUser
      security: []
      requestBody:
        description: User to create
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/User'
                - $ref: '#/components/schemas/Credentials'
            examples:
              Marc:
                value:
                  name: Marc
                  email: marc@example.com
                  password: correct-horse
              Cam:
                value:
                  name: Cam
                  email: cam@example.com
                  password: battery-staple
              Hans:
                value:
                  name: Hans
                  email: hans@example.com
                  password: s3cr3t
          application/xml:
            schema:
              allOf:
                - $ref: '#/components/schemas/User'
                - $ref: '#/components/schemas/Credentials'
            examples:
              Marc:
                value:
                  name: Marc
                  email: marc@example.com
                  password: correct-horse
              Cam:
                value:
                  name: Cam
                  email: cam@example.com
                  password: battery-staple
              Hans:
                value:
                  name: Hans
                  email: hans@example.com
                  password: s3cr3t
      responses:
        '201':
          description: User account created successfully
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Location:
              $ref: '#/components/headers/Location'
            X-Processing-Time:
              $ref: '#/components/headers/X-Processing-Time'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
            application/xml:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /auth/token:
    post:
      tags:
        - Authentication
      summary: Get a token
      description:
        Trade credentials for a token.
      operationId: getToken
      security: []
      requestBody:
        description: Body for credentials to authenticate a user
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
          application/xml:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '201':
          description: Token Created
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
            application/xml:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me:
    get:
      tags:
        - Authentication
      summary: Get authenticated user
      description: Find yourself they say. That's what you can do here.
      operationId: getMe
      security:
        - basicAuth: []
        - oAuth2:
            - read:account
        - bearerAuth: []
        - apiKeyHeader: []
        - apiKeyQuery: []
        - apiKeyHeader: []
          apiKeyQuery: []
      responses:
        '200':
          description: Authenticated user information retrieved successfully
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/Last-Modified'
            X-Cache-Control:
              $ref: '#/components/headers/X-Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
            application/xml:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
webhooks:
  newProduct:
    post:
      tags:
        - Products
      security: []
      requestBody:
        description: Information about a new product
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description:
            Return a 200 status to indicate that the data was received
            successfully
components:
  links:
    GetProduct:
      operationId: getProduct
      description: Retrieve the product using the ID returned in the response.
      parameters:
        productId: '$response.body#/id'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: JWT Bearer token authentication
    basicAuth:
      type: http
      scheme: basic
      description: Basic HTTP authentication
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key request header
    apiKeyQuery:
      type: apiKey
      in: query
      name: api_key
      description: API key query parameter
      deprecated: true
    apiKeyCookie:
      type: apiKey
      in: cookie
      name: api_key
      description: API key browser cookie
    oAuth2:
      type: oauth2
      description: OAuth 2.0 authentication
      oauth2MetadataUrl: https://shop.example.com/.well-known/oauth-authorization-server
      flows:
        authorizationCode:
          authorizationUrl: https://shop.example.com/oauth/authorize
          tokenUrl: https://shop.example.com/oauth/token
          scopes:
            read:account: read your account information
            write:products: modify products in your account
            read:products: read your products
        clientCredentials:
          tokenUrl: https://shop.example.com/oauth/token
          scopes:
            read:account: read your account information
            write:products: modify products in your account
            read:products: read your products
        deviceAuthorization:
          deviceAuthorizationUrl: https://shop.example.com/oauth/device
          tokenUrl: https://shop.example.com/oauth/token
          scopes:
            read:account: read your account information
            write:products: modify products in your account
            read:products: read your products
        implicit:
          authorizationUrl: https://shop.example.com/oauth/authorize
          scopes:
            read:account: read your account information
            write:products: modify products in your account
            read:products: read your products
        password:
          tokenUrl: https://shop.example.com/oauth/token
          scopes:
            read:account: read your account information
            write:products: modify products in your account
            read:products: read your products
    openIdConnect:
      type: openIdConnect
      openIdConnectUrl: https://shop.example.com/.well-known/openid-configuration
      description: OpenID Connect Authentication
  parameters:
    ifNoneMatch:
      name: If-None-Match
      description: The entity tags of the copies the client holds
      in: header
      schema:
        type: string
    ifMatch:
      name: If-Match
      description: The entity tag of the copy the client changed
      in: header
      schema:
        type: string
    productId:
      name: productId
      description: The ID of the product to get
      in: path
      required: true
      schema:
        type: integer
        format: int64
        examples:
          - 1
    limit:
      name: limit
      description: The number of items to return
      in: query
      required: false
      schema:
        type: integer
        format: int64
        default: 10
    offset:
      name: offset
      description: The number of items to skip before starting to collect the result set
      in: query
      required: false
      schema:
        type: integer
        format: int64
        default: 0
  headers:
    X-RateLimit-Limit:
      description: The number of allowed requests in the current period
      schema:
        type: integer
        example: 100
    X-RateLimit-Remaining:
      description: The number of remaining requests in the current period
      schema:
        type: integer
        example: 95
    X-RateLimit-Reset:
      description: The number of seconds left in the current period
      schema:
        type: integer
        example: 3600
    X-Request-ID:
      description: Unique identifier for the request
      schema:
        type: string
        format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
    X-Pagination-Total:
      description: Total number of items available
      schema:
        type: integer
        example: 1000
    X-Pagination-Page:
      description: Current page number
      schema:
        type: integer
        example: 1
    X-Pagination-Per-Page:
      description: Number of items per page
      schema:
        type: integer
        example: 10
    X-Cache-Control:
      description: Cache control directives
      schema:
        type: string
        example: max-age=3600, public
    ETag:
      description: Entity tag for caching
      schema:
        type: string
        example: '"33a64df551"'
    Last-Modified:
      description: The last modification date of the resource
      schema:
        type: string
        format: date-time
        example: 2023-12-01T12:00:00Z
    Location:
      description: The URL of the newly created resource
      schema:
        type: string
        format: uri
        example: https://shop.example.com/products/123
    X-Processing-Time:
      description: The time taken to process the request in milliseconds
      schema:
        type: integer
        example: 150
  responses:
    ImageUploaded:
      description: Image uploaded
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        X-Cache-Control:
          $ref: '#/components/headers/X-Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ImageUploadedMessage'
        application/xml:
          schema:
            $ref: '#/components/schemas/ImageUploadedMessage'
    BadRequest:
      description: Bad Request
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadRequestError'
        application/xml:
          schema:
            $ref: '#/components/schemas/BadRequestError'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForbiddenError'
        application/xml:
          schema:
            $ref: '#/components/schemas/ForbiddenError'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundError'
        application/xml:
          schema:
            $ref: '#/components/schemas/NotFoundError'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedError'
        application/xml:
          schema:
            $ref: '#/components/schemas/UnauthorizedError'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Conflict'
        application/xml:
          schema:
            $ref: '#/components/schemas/Conflict'
    UnprocessableEntity:
      description: Unprocessable Entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnprocessableEntity'
        application/xml:
          schema:
            $ref: '#/components/schemas/UnprocessableEntity'
    TooManyRequests:
      description: Too Many Requests
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
        Retry-After:
          description: The number of seconds to wait before retrying
          schema:
            type: integer
            example: 60
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TooManyRequestsError'
        application/xml:
          schema:
            $ref: '#/components/schemas/TooManyRequestsError'
  schemas:
    User:
      description: A user
      type: object
      xml:
        name: user
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          examples:
            - 1
        name:
          type: string
          examples:
            - Marc
            - Cam
            - Hans
    Credentials:
      description: Credentials to authenticate a user
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          examples:
            - marc@example.com
            - cam@example.com
            - hans@example.com
        password:
          type: string
          writeOnly: true
          examples:
            - correct-horse
            - correct-horse
            - qwerty123
    Token:
      description: A token to authenticate a user
      type: object
      properties:
        token:
          type: string
          examples:
            - eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
    Item:
      oneOf:
        - $ref: '#/components/schemas/Product'
        - $ref: '#/components/schemas/Variant'
      discriminator:
        propertyName: type
        mapping:
          hardware: '#/components/schemas/Product'
          software: '#/components/schemas/Product'
          service: '#/components/schemas/Product'
          accessory: '#/components/schemas/Product'
          subscription: '#/components/schemas/Product'
          size: '#/components/schemas/Variant'
          color: '#/components/schemas/Variant'
          edition: '#/components/schemas/Variant'
      description: A item which can be either a product or a variant
    Product:
      description: A product in the shop
      type: object
      required:
        - id
        - name
      additionalProperties: false
      xml:
        name: product
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          xml:
            nodeType: attribute
          examples:
            - 1
        name:
          type: string
          examples:
            - Desk lamp
            - Office chair
            - HD 40307g
        description:
          type:
            - string
            - 'null'
          xml:
            nodeType: cdata
          examples:
            - The red product
            - A chair with lumbar support
        type:
          type: string
          enum:
            - hardware
            - software
            - service
            - accessory
            - subscription
          x-enum-varnames:
            - Hardware
            - Software
            - Service
            - Accessory
            - Subscription
          examples:
            - hardware
        rating:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: A score from 0 to 1 indicating how customers rate it
          examples:
            - 0.68
        dimensions:
          type: object
          additionalProperties:
            type: number
            format: float
            description: Additional measurements of the product
          properties:
            weight:
              type: number
              format: float
              exclusiveMinimum: 0
              description: Weight in kilograms (must be greater than 0)
              examples:
                - 3.5
            width:
              type: number
              format: float
              exclusiveMinimum: 0
              description: Width in centimetres (must be greater than 0)
              examples:
                - 40
            height:
              type: number
              format: float
              description: Height in centimetres
              examples:
                - 55
            price:
              type: object
              additionalProperties:
                type: number
                format: float
                description: Additional prices in euros
              properties:
                min:
                  type: number
                  format: float
                  description: Lowest price in euros
                  examples:
                    - 130
                max:
                  type: number
                  format: float
                  description: Highest price in euros
                  examples:
                    - 308
                average:
                  type: number
                  format: float
                  description: Average price in euros
                  examples:
                    - 210
        materials:
          type: array
          description: Materials it is made of
          items:
            type: object
            additionalProperties:
              type: string
              description: Additional material data
            properties:
              material:
                type: string
                examples:
                  - steel
                  - oak
              percentage:
                type: number
                format: float
                exclusiveMaximum: 100
                examples:
                  - 95.3
        listedAt:
          type: string
          format: date-time
          examples:
            - 2024-01-07T00:00:00Z
        image:
          type:
            - string
            - 'null'
          examples:
            - https://cdn.example.com/photos/lamp.jpg
        variants:
          type: array
          xml:
            nodeType: none
          items:
            $ref: '#/components/schemas/Variant'
        creator:
          $ref: '#/components/schemas/User'
        tags:
          type: array
          xml:
            nodeType: element
            name: tags
          items:
            type: string
            xml:
              name: tag
          examples:
            - - office
              - lighting
              - in-stock
        lastUpdated:
          type: string
          format: date-time
          readOnly: true
          examples:
            - 2024-01-15T14:30:00Z
        successCallbackUrl:
          type: string
          format: uri
          description: URL which gets invoked upon a successful operation
          examples:
            - https://example.com/webhook
        failureCallbackUrl:
          type: string
          format: uri
          description: URL which gets invoked upon a failed operation
          examples:
            - https://example.com/webhook
    Variant:
      description: Every variant in the shop
      type: object
      required:
        - name
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          examples:
            - 1
        name:
          type: string
          examples:
            - Large
        description:
          type:
            - string
            - 'null'
          examples:
            - The large size, for desks wider than 120 cm.
        length:
          type: number
          format: float
          description: Length in centimetres
          examples:
            - 22.2
        type:
          type: string
          enum:
            - size
            - color
            - edition
          x-enum-varnames:
            - Size
            - Color
            - Edition
          examples:
            - size
        shipping:
          type: object
          properties:
            product:
              $ref: '#/components/schemas/Product'
            deliveryDays:
              type: number
              format: float
              description: Delivery time in days
              examples:
                - 0.319
            distance:
              type: number
              format: float
              description: Average distance from the product in kilometers
              examples:
                - 9376
    ProductQuery:
      description:
        A structured query for the product catalog, sent either as the body of a
        QUERY request or as a `querystring` parameter.
      type: object
      properties:
        name:
          type: string
          description: Match products whose name contains this text
          examples:
            - Desk lamp
        type:
          type: array
          description: Restrict results to these product types
          items:
            type: string
            enum:
              - hardware
              - software
              - service
              - accessory
              - subscription
          examples:
            - - hardware
              - subscription
        minRating:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Only return products at or above this rating
          examples:
            - 0.5
        sort:
          type: string
          enum:
            - name
            - -name
            - rating
            - -rating
          description: Sort field; prefix with `-` for descending order
          examples:
            - -rating
    ProductEvent:
      description: A single event emitted on the product stream. Each item in a
        `text/event-stream`, `application/jsonl` or `application/json-seq` response
        validates against this schema.
      type: object
      xml:
        name: event
      required:
        - event
        - product
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the event
          xml:
            nodeType: attribute
          examples:
            - 123e4567-e89b-12d3-a456-426614174000
        event:
          type: string
          enum:
            - created
            - updated
            - deleted
            - discontinued
          description: The kind of change that occurred
          xml:
            nodeType: attribute
          examples:
            - created
        product:
          $ref: '#/components/schemas/Product'
        note:
          $ref: '#/components/schemas/ShopMessage'
        occurredAt:
          type: string
          format: date-time
          examples:
            - 2024-01-15T14:30:00Z
    ShopMessage:
      description:
        A short, localized message. Demonstrates the OpenAPI 3.2 XML `nodeType`
        values `attribute` and `text`, which serialize as
        `<message lang="en">A new product has appeared</message>`.
      type: object
      xml:
        name: message
      properties:
        lang:
          type: string
          description: BCP 47 language tag
          xml:
            nodeType: attribute
          examples:
            - en
        value:
          type: string
          description: The message text, serialized as the element's text content
          xml:
            nodeType: text
          examples:
            - A new product has appeared
    PhotoBatchMeta:
      description: Metadata describing a batch of uploaded photos
      type: object
      required:
        - photographer
      properties:
        photographer:
          type: string
          description: Who captured the photos
          examples:
            - Studio North
        takenAt:
          type: string
          format: date-time
          examples:
            - 2024-01-15T14:30:00Z
        count:
          type: integer
          description: Number of image parts that follow this metadata part
          examples:
            - 12
    PaginatedResource:
      description:
        A generic paginated resource. Specializing schemas bind the item type by declaring a
        `$dynamicAnchor` named `itemType`, the JSON Schema 2020-12 way to express `PaginatedResource<T>`.
      $id: 'https://shop.example.com/schemas/PaginatedResource'
      $defs:
        itemType:
          $dynamicAnchor: itemType
          not: {}
      type: object
      properties:
        data:
          type: array
          items:
            $dynamicRef: '#itemType'
        meta:
          type: object
          properties:
            limit:
              type: integer
              format: int64
              examples:
                - 10
            offset:
              type: integer
              format: int64
              examples:
                - 0
            total:
              type: integer
              format: int64
              examples:
                - 100
            next:
              type:
                - string
                - 'null'
              examples:
                - /products?limit=10&offset=10
    ImageUploadedMessage:
      description: Message about an image upload
      type: object
      properties:
        message:
          type: string
          examples:
            - Image uploaded successfully
        imageUrl:
          type: string
          description: The URL where the uploaded image can be accessed
          examples:
            - https://cdn.example.com/images/8f47c132-9d1f-4f83-b5a4-91db5ee757ab.jpg
        uploadedAt:
          type: string
          format: date-time
          description: Timestamp when the image was uploaded
          examples:
            - 2024-01-15T14:30:00Z
        fileSize:
          type: integer
          description: Size of the uploaded image in bytes
          examples:
            - 1048576
        mimeType:
          type: string
          description: The content type of the uploaded image
          examples:
            - image/jpeg
            - image/png
    BadRequestError:
      description: RFC 7807 (https://datatracker.ietf.org/doc/html/rfc7807)
      type: object
      properties:
        type:
          type: string
          examples:
            - https://example.com/errors/bad-request
        title:
          type: string
          examples:
            - Bad Request
        status:
          type: integer
          format: int64
          examples:
            - 400
        detail:
          type: string
          examples:
            - The request was invalid.
    ForbiddenError:
      description: Error response for forbidden access (RFC 7807). Returned when the user does not have permission to access the requested resource.
      type: object
      properties:
        type:
          type: string
          examples:
            - https://example.com/errors/forbidden
        title:
          type: string
          examples:
            - Forbidden
        status:
          type: integer
          format: int64
          examples:
            - 403
        detail:
          type: string
          examples:
            - You are not authorized to access this resource.
    NotFoundError:
      description: Error response for resource not found (RFC 7807). Returned when the requested resource does not exist.
      type: object
      properties:
        type:
          type: string
          examples:
            - https://example.com/errors/not-found
        title:
          type: string
          examples:
            - Not Found
        status:
          type: integer
          format: int64
          examples:
            - 404
        detail:
          type: string
          examples:
            - The resource you are trying to access does not exist.
    UnauthorizedError:
      description: Error response for unauthorized access (RFC 7807). Returned when authentication is required or has failed.
      type: object
      properties:
        type:
          type: string
          examples:
            - https://example.com/errors/not-found
        title:
          type: string
          examples:
            - Unauthorized
        status:
          type: integer
          format: int64
          examples:
            - 401
        detail:
          type: string
          examples:
            - You are not authorized to access this resource.
    Conflict:
      description: Error response for resource conflicts (RFC 7807). Returned when the request conflicts with the current state of the resource.
      type: object
      properties:
        type:
          type: string
          examples:
            - https://example.com/errors/conflict
        title:
          type: string
          examples:
            - Conflict
        status:
          type: integer
          format: int64
          examples:
            - 409
        detail:
          type: string
          examples:
            - The resource you are trying to access is in conflict.
    UnprocessableEntity:
      description: Error response for unprocessable entity (RFC 7807). Returned when the request is well-formed but contains semantic errors.
      type: object
      properties:
        type:
          type: string
          examples:
            - https://example.com/errors/unprocessable-entity
        title:
          type: string
          examples:
            - Unprocessable Entity
        status:
          type: integer
          format: int64
          examples:
            - 422
        detail:
          type: string
          examples:
            - The request was invalid.
    TooManyRequestsError:
      description: Error response for rate limiting (RFC 7807). Returned when the client has exceeded the rate limit for requests.
      type: object
      properties:
        type:
          type: string
          examples:
            - https://example.com/errors/too-many-requests
        title:
          type: string
          examples:
            - Too Many Requests
        status:
          type: integer
          format: int64
          examples:
            - 429
        detail:
          type: string
          examples:
            - Rate limit exceeded. Please try again later.
