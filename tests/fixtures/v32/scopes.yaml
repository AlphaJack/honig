openapi: 3.2.0
info: {title: Scopes, version: "1"}
components:
  securitySchemes:
    pat:
      type: http
      scheme: bearer
      description: A personal access token of a shop owner.
paths:
  # ANCHOR: scopes
  /orders:
    get:
      operationId: listOrders
      # Either permission is enough (OR).
      security:
        - pat: ["orders:read"]
        - pat: ["orders:write"]
      responses:
        "204": {description: Listed.}
    post:
      operationId: createOrder
      security:
        - pat: ["orders:write"]
      responses:
        "204": {description: Created.}
  # ANCHOR_END: scopes
  /public:
    get:
      operationId: open
      responses:
        "204": {description: Open.}
