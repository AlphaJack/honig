openapi: 3.2.0
info: {title: Validation, version: "1"}
paths:
  # The only response is a string enum: a `Copy` body that the server encodes.
  /mode:
    get:
      operationId: getMode
      responses:
        "200":
          description: The mode
          content:
            application/json:
              schema: {type: string, enum: [on, off]}
  /users:
    post:
      operationId: createUser
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: X-Team, in: header, schema: {type: string, pattern: '^[a-z]+$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/User'}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        # A closed schema with a closed `code` list: the runtime cannot fill it, a handler's typed error can.
        "4XX":
          description: Refused.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /shipments:
    post:
      operationId: createShipment
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Shipment'}
      responses:
        "201":
          description: Created.
        # An RFC 9457 body that the runtime fills by its members' names, with a `const` of its own. It is the API's most
        # common one, and still not what `createUser` refuses in.
        "400":
          description: Refused.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Refusal'}
  /logins:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Login'}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Login'}
  # Several media types: the body is an enum, and each variant is checked.
  /members:
    post:
      operationId: addMember
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/User'}}
          application/x-www-form-urlencoded: {schema: {$ref: '#/components/schemas/User'}}
      responses:
        "201":
          description: Created.
  # A closed object is closed in every media type: an unknown field is a bad request.
  /closed:
    post:
      operationId: addClosed
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/Closed'}}
          application/x-www-form-urlencoded: {schema: {$ref: '#/components/schemas/Closed'}}
          application/xml: {schema: {$ref: '#/components/schemas/Closed'}}
      responses:
        "201":
          description: Created.
  /badges:
    post:
      operationId: addBadge
      requestBody:
        content:
          application/json: {schema: {$ref: '#/components/schemas/Badge'}}
          application/x-www-form-urlencoded: {schema: {$ref: '#/components/schemas/Badge'}}
      responses:
        "201":
          description: Created.
components:
  schemas:
    # Two aliases of `string`: values of them swap without a type error, so a struct of both gets no positional `new`.
    Sku: {type: string}
    Title: {type: string}
    Listing:
      type: object
      required: [sku, title]
      properties:
        sku: {$ref: '#/components/schemas/Sku'}
        title: {$ref: '#/components/schemas/Title'}
    # A pattern beside a typed format runs on the text before the format parses it.
    LegacyId: {type: string, format: uuid, pattern: '^0'}
    # A limit beside a type of yours runs on the JSON value before it converts.
    Cents: {type: integer, maximum: 100, x-rust-type: i64}
    Wallet: {type: object, required: [cents], properties: {cents: {$ref: '#/components/schemas/Cents'}}}
    # A length on base64 bytes runs on their text.
    Token: {type: string, format: byte, maxLength: 8}
    # `unevaluatedProperties` beside `anyOf` sees the properties of each branch that matches.
    Tagged:
      type: object
      properties:
        size: {type: integer}
      anyOf:
        - {properties: {label: {const: a}}, required: [label]}
        - {properties: {colour: {const: red}}, required: [colour]}
      unevaluatedProperties: false
    # Keywords of each kind beside an implied shape: each checks the values of its kind.
    Implied:
      properties: {name: {type: string}}
      required: [name]
      minLength: 2
      minimum: 1
      uniqueItems: true
    # `oneOf` of branches that only list `required`: exactly one of the names.
    Reach:
      type: object
      properties: {email: {type: string}, phone: {type: string}}
      oneOf: [{required: [email]}, {required: [phone]}]
    # `anyOf` of two strings: the first branch that decodes, with its keywords, is the answer.
    Slug:
      anyOf: [{type: string, enum: [""]}, {type: string, pattern: '^[a-z]+$'}]
    # A boolean that may only be `true`: a typed constant.
    AlwaysTrue:
      type: boolean
      enum: [true]
    # A member that narrows a property of another: `at` must be a string of at most 5 characters, never `null`.
    Stamp:
      type: object
      properties: {at: {type: [string, "null"]}}
    NarrowStamp:
      allOf:
        - {$ref: '#/components/schemas/Stamp'}
        - {type: object, required: [at], properties: {at: {type: string, maxLength: 5}}}
    # `oneOf` of two strings: exactly one branch may accept a value.
    Code:
      oneOf: [{type: string, maxLength: 3}, {type: string, pattern: '^[a-z]+$'}]
    # A decimal keeps its digits: its range and `multipleOf` apply to them, past what an `f64` tells apart.
    Exact:
      type: object
      properties:
        tenth: {type: number, format: decimal, minimum: 0.1}
        cents: {type: number, format: decimal, multipleOf: 0.01}
    # Integer keywords checked exactly. A bound that no value of the type meets leaves none, and `multipleOf: 2.5`
    # accepts the integers that are multiples of 5.
    Degenerate:
      type: object
      properties:
        huge: {type: integer, minimum: 1e40}
        fives: {type: integer, multipleOf: 2.5}
        zero: {type: integer, format: uint8, multipleOf: 1000}
        half: {type: integer, minimum: 0.5, exclusiveMaximum: 3.5}
    # Branches told apart only by the type of a field after a recursive one. Each branch that cannot fit is skipped
    # before its nested trees are decoded. The check of `oneOf` follows the recursion through `$defs`.
    # An `if` on a property that may be absent: without `kind` the `if` passes and its `then` asks for `x`.
    Kinded:
      type: object
      properties:
        kind: {type: string}
        x: {type: string}
      if: {properties: {kind: {const: a}}}
      then: {required: [x]}
    # Two conditionals with an `else` each: the `else` of one applies to the values of the other.
    TwoElses:
      type: object
      required: [kind]
      properties: {kind: {type: string}, x: {type: string}, y: {type: string}, z: {type: string}}
      allOf:
        - if: {properties: {kind: {const: a}}}
          then: {required: [x]}
          else: {required: [z]}
        - if: {properties: {kind: {const: b}}}
          then: {required: [y]}
          else: {required: [z]}
    # Branches that pin `kind` without requiring it: `{}` is the first branch, so `kind` tags nothing.
    LooseKind:
      anyOf:
        - {type: object, properties: {kind: {const: a}}}
        - {type: object, required: [n], properties: {kind: {const: b}, n: {type: integer}}}
    # Bounds past the range of the integer type: every value meets them.
    WideMax: {type: integer, format: int32, maximum: 5000000000}
    WideMin: {type: integer, format: int8, minimum: -1000}
    WideByte: {type: integer, format: uint8, maximum: 300}
    Tree:
      oneOf:
        - type: object
          required: [items, x]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/Tree'}}
            x: {type: string}
        - type: object
          required: [items, x]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/Tree'}}
            x: {type: integer}
    # A recursive union whose branches no guard tells apart: each branch decodes the value nested in it.
    Bundle:
      oneOf:
        - type: object
          properties:
            contents: {$ref: '#/components/schemas/Bundle'}
            sku: {type: string}
        - type: object
          properties:
            contents: {$ref: '#/components/schemas/Bundle'}
            count: {type: integer}
    # A list of `allOf` items with a nullable property nine levels down. Both members
    # declare `lines`: one merged struct would keep one of them, so the item is checked whole at run time, and every
    # keyword is still there after the references are inlined.
    Ledger:
      type: object
      properties:
        entries: {type: array, items: {$ref: '#/components/schemas/Entry'}}
    Entry:
      allOf:
        - $ref: '#/components/schemas/EntryFields'
        - type: object
          properties:
            id: {type: integer}
            lines: {maxItems: 2}
    EntryFields:
      type: object
      properties:
        lines: {type: array, items: {$ref: '#/components/schemas/Line'}}
    Line:
      type: object
      properties:
        note: {type: [string, 'null'], maxLength: 3}
    Refusal:
      type: object
      required: [detail, object]
      properties:
        detail: {type: string}
        object: {type: string, const: error}
    Problem:
      type: object
      additionalProperties: false
      required: [code, status, detail]
      properties:
        code: {type: string, enum: [INVALID, TAKEN]}
        status: {type: integer, format: int32}
        detail: {type: string}
    Closed:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string}
      xml: {name: closed}
    # No property allowed: only `{}` is valid.
    NoOptions:
      type: object
      additionalProperties: false
    # Untyped keywords (`contains`) with a required `readOnly` id a request leaves out.
    Badge:
      type: object
      required: [id, label, holders]
      properties:
        id: {type: integer, readOnly: true}
        label: {type: string, maxLength: 5}
        holders: {type: array, items: {type: string}, contains: {const: owner}}
    Login:
      type: object
      required: [user, password, token]
      properties:
        user: {type: string}
        password: {type: string, writeOnly: true, minLength: 8}
        token: {type: string, readOnly: true}
    Shipment:
      type: object
      required: [kind, parcels]
      properties:
        kind: {type: string, enum: [domestic, international]}
        customs: {type: string}
        insured: {type: boolean}
        insurer: {type: string}
        options: {$ref: '#/components/schemas/NoOptions'}
        # No `type`: `minimum` still applies to a number.
        rating: {minimum: 1}
        # No `type`: the properties apply to an object, and any other value is valid.
        meta: {properties: {count: {type: integer}}}
        # A default fills in a field left out. One that its own schema refused would fail the test of the examples.
        label: {type: string, minLength: 4, default: none}
        parcels:
          type: array
          items: {type: object, properties: {fragile: {type: boolean}}}
          contains: {properties: {fragile: {const: true}}, required: [fragile]}
          maxContains: 2
        scores:
          type: object
          patternProperties: {'^[a-z]+$': {type: integer, minimum: 0}}
          additionalProperties: false
        # Optional and nullable, with bounds: its sample keeps to them.
        priority: {type: [number, 'null'], minimum: 0, maximum: 2}
        weight: {type: [integer, 'null'], minimum: 256}
        labels:
          type: object
          propertyNames: {pattern: '^[a-z]+$'}
          patternProperties:
            '^x': {type: string, maxLength: 3}
          additionalProperties: {type: string}
      dependentRequired:
        insured: [insurer]
      if: {properties: {kind: {const: international}}}
      then: {required: [customs]}
      not: {required: [customs, insurer], properties: {customs: {const: "none"}}}

    # Keywords without `type`: each applies to values of its kind, and any other value passes.
    Loose:
      type: object
      properties:
        v: {minimum: 1, maxLength: 3}

    # `dependentSchemas` over declared properties: with a code, the voucher has an amount of at most 100.
    Voucher:
      type: object
      properties:
        code: {type: string}
        amount: {type: integer}
      dependentSchemas:
        code: {properties: {amount: {maximum: 100}}, required: [amount]}

    # `dependentRequired` over declared properties: a check of the fields, with no schema checked whole.
    Payment:
      type: object
      properties:
        card: {type: string}
        cvc: {type: string}
        holder: {type: [string, 'null']}
        note: {type: string}
      dependentRequired:
        card: [cvc, holder]

    # `propertyNames` that checks only text: a check of each name, with no schema checked whole. A map component is an
    # alias: its keywords apply where it is used, as `minProperties` does.
    Labelled:
      type: object
      properties:
        labels: {$ref: '#/components/schemas/Labels'}
    Labels:
      type: object
      additionalProperties: {type: string}
      propertyNames: {pattern: '^[a-z]+$', maxLength: 8}
    # `minProperties` and `maxProperties` on a struct count the declared properties sent and the names it keeps.
    Pair:
      type: object
      properties:
        a: {type: string}
        b: {type: string}
      additionalProperties: {type: string}
      minProperties: 1
      maxProperties: 2
    # Patterns beside properties: each undeclared name decodes into the map of the first pattern that matches it, as
    # every pattern that matches it. `additionalProperties: false` refuses a name that none matches.
    Settings:
      type: object
      properties:
        name: {type: string}
      patternProperties:
        '^x_': {type: string, maxLength: 3}
        '_n$': {type: integer, minimum: 0}
      additionalProperties: false
    # On a struct the names of the declared properties that are present count, and so do the names it does not declare.
    Profile:
      type: object
      properties:
        name: {type: string}
        Nick-Name: {type: string}
      propertyNames: {pattern: '^[a-z]+$'}

    # One `patternProperties` entry of a closed map: every name matches the pattern and every value decodes as its
    # schema, with no schema checked whole.
    Scored:
      type: object
      properties:
        scores: {$ref: '#/components/schemas/Scores'}
    Scores:
      type: object
      patternProperties:
        '^[a-z]+$': {type: integer, minimum: 0}
      additionalProperties: false

    Price:
      type: object
      properties:
        # A multiple a binary float cannot represent exactly: 0.07 / 0.01 is 7.000000000000001.
        amount: {type: number, multipleOf: 0.01}
        # `null` alone: the only value it allows.
        retired: {type: 'null'}

    User:
      type: object
      required: [name, role]
      properties:
        name: {type: string, minLength: 2, maxLength: 10, pattern: '^\p{Lu}'}
        # A pattern that backtracks: past `maxLength` it does not run.
        handle: {type: string, maxLength: 20, pattern: '^(a+)+$'}
        age: {type: integer, minimum: 0, exclusiveMaximum: 150}
        score: {type: number, multipleOf: 0.5}
        tags:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, maxLength: 3}
        role: {type: string, enum: [admin, user]}
        email: {type: string, format: email}
        site: {type: string, format: idn-hostname}
        meta:
          type: object
          maxProperties: 2
          additionalProperties: {type: string}
        # The bounds of a branch apply to the value that it accepts: a loyalty level or a tier code.
        loyalty:
          oneOf:
            - {type: integer, minimum: 1, maximum: 10}
            - {type: string, maxLength: 3}
        # The bounds of the one branch beside `null` apply too.
        note:
          anyOf:
            - {type: string, maxLength: 5}
            - {type: 'null'}
