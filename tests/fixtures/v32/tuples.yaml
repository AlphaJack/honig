openapi: 3.2.0
info: {title: Tuples, version: "1"}
paths:
  /route:
    post:
      operationId: plan
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Route'}
      responses:
        "200":
          description: The route, echoed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Route'}
components:
  schemas:
    Point:
      description: A closed tuple, every position required.
      type: array
      prefixItems: [{type: number}, {type: number}, {type: string}]
      items: false
      minItems: 3
    Open:
      description: Open prefixItems stay a list of JSON values.
      type: array
      prefixItems: [{type: string}]
    Route:
      type: object
      required: [start, stops]
      properties:
        start: {$ref: '#/components/schemas/Point'}
        stops: {type: array, items: {$ref: '#/components/schemas/Point'}}
        tags: {$ref: '#/components/schemas/Open'}
