name: Release PR

# requirements:
# - secret RELEASE_PLZ_TOKEN: a fine-grained PAT with read and write access to the contents and
#   pull requests of this repository. PRs and tags made with the repository token start no workflow.

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  release-plz:
    name: Update the release PR, or publish
    if: >-
      ${{ !github.event.repository.fork
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # needed to list changes
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Check that main is still the commit CI tested
        id: tested
        env:
          TESTED: ${{ github.event.workflow_run.head_sha }}
        run: echo "current=$([ "$(git rev-parse HEAD)" = "$TESTED" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        if: steps.tested.outputs.current == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "stable"
      - name: Run release-plz
        if: steps.tested.outputs.current == 'true'
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
