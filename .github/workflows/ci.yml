name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Without debug info test builds are faster, most of all on Windows. A panic still names its line.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "stable"
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "stable"
          # `cargo acyclic` indexes the code with rust-analyzer.
          components: clippy, rust-analyzer
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The generator without its HTTPS client and overlays. It reports remote refs and overlays and does not apply them.
      - name: Clippy without default features
        run: cargo clippy -p cargo-honig --all-targets --no-default-features --locked -- -D warnings
      # The benches and the optional codecs and adapters.
      - name: Clippy with every runtime feature
        run: cargo clippy -p honig --all-targets --all-features --locked -- -D warnings
      - name: Install cargo-acyclic
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-acyclic
      # No cycles between modules or items and no calls up to a free function of an ancestor. Layers in order.
      - name: Modules are acyclic
        run: cargo acyclic

  # The API docs and the book.
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "stable"
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --document-private-items --locked
      # What docs.rs builds: public items only, so a link to a private item fails here and not above.
      - name: Rustdoc as docs.rs builds it
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc -p honig --no-deps --all-features --locked
          cargo doc -p cargo-honig --no-deps --locked
      - name: Install mdbook
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: mdbook
      - name: Build the book
        run: mdbook build docs/book

  # Each runtime feature alone and no features. `--workspace` turns on every feature that the e2e crate asks for. So only
  # this job finds a missing `cfg` or a test without the feature that it needs.
  features:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "stable"
          components: clippy
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-hack and cargo-nextest
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-hack,cargo-nextest
      - name: Clippy, each runtime feature
        run: cargo hack clippy -p honig --each-feature --all-targets --locked -- -D warnings
      - name: Test, each runtime feature
        run: cargo hack nextest run -p honig --each-feature --locked
      # The generator with only the runtime features that it asks for itself. In `--workspace` the e2e crate turns
      # on more (`regress`), so a check the CLI cannot run still passes there. Its own target directory keeps the
      # unified build's artifacts out.
      # The fuzz and coverage tests do not depend on features: the test job runs them.
      - name: Test the generator alone
        run: cargo nextest run -p cargo-honig --locked --target-dir target/isolated -E 'not test(/fuzz|coverage/)'
      # The generator without its HTTPS client and overlays.
      - name: Test the generator without default features
        run: cargo nextest run -p cargo-honig --lib --no-default-features --locked --target-dir target/isolated -E 'not test(/fuzz|coverage/)'

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "stable"
          # `wasm_client` checks the browser client compiles for wasm32.
          targets: wasm32-unknown-unknown
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest
      - name: Test
        run: cargo nextest run --workspace --locked --run-ignored all
      - name: Doctests
        run: cargo test --workspace --doc --locked

  # Paths and line endings differ on Windows. Not a required check.
  test-windows:
    name: test (windows-latest)
    runs-on: windows-latest
    steps:
      # Before anything is checked out, installed, built or written, so that no scanner reads it.
      - name: Turn off Defender's scanners
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -DisableBehaviorMonitoring $true -DisableIOAVProtection $true -DisableScriptScanning $true -DisableArchiveScanning $true -DisableBlockAtFirstSeen $true
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "stable"
          # `wasm_client` checks the browser client compiles for wasm32.
          targets: wasm32-unknown-unknown
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest
      # Every failure, not the first one only.
      - name: Test
        run: cargo nextest run --workspace --locked --run-ignored all --no-fail-fast

  # The scaling gate fails when a path costs more than n^1.3. It counts instructions under callgrind, so its counts
  # are the same on every run. The time gate races generated paths against hand-rolled axum twins:
  # `tests/e2e/benches/time_gate.rs`. It builds e2e in release, so a pull request runs it only when it changes what a
  # request costs: the runtime, the emitted code, e2e or a dependency.
  performance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check what changed
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ] && git diff --quiet "origin/$BASE_REF...HEAD" -- runtime/src src/emit tests/e2e Cargo.lock; then
            echo "time=false" >> "$GITHUB_OUTPUT"
          else
            echo "time=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "stable"
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The runner's package index goes stale: without an update apt asks for packages that the mirror has dropped.
      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind
      - name: Scaling gate, runtime
        run: cargo bench -p honig --bench scaling_gate --features cookie,multipart,server,xml --locked
      - name: Scaling gate, generator
        run: cargo bench -p cargo-honig --bench scaling_gate --locked
      - name: Time gate
        if: steps.changed.outputs.time == 'true'
        run: cargo bench -p e2e --bench time_gate --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  workflows:
    name: Check workflows
    runs-on: ubuntu-latest
    env:
      ACTIONLINT: v1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: zizmor
      - name: Install actionlint
        run: |
          curl -fsSLo actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/$ACTIONLINT/actionlint_${ACTIONLINT#v}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  actionlint.tgz" | sha256sum -c
          tar xzf actionlint.tgz actionlint
      - name: Run actionlint and zizmor
        run: |
          ./actionlint
          zizmor --offline .
