name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Without debug info test builds are faster, most of all on Windows. A panic still shows its line.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "stable"
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "stable"
          components: clippy
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The generator without its HTTPS client and overlays. It reports remote refs and overlays and does not apply them.
      - name: Clippy without default features
        run: cargo clippy -p cargo-honig --all-targets --no-default-features --locked -- -D warnings
      # The benches and the optional codecs and adapters.
      - name: Clippy with every runtime feature
        run: cargo clippy -p honig --all-targets --all-features --locked -- -D warnings
  # No cycles between modules or items and no calls up to a free function of an ancestor. Layers in order.
  acyclic:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "stable"
          # `cargo acyclic` indexes the code with rust-analyzer.
          components: rust-analyzer
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-acyclic
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-acyclic
      - name: Modules are acyclic
        run: cargo acyclic

  # The API docs and the book.
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "stable"
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --document-private-items --locked
      # What docs.rs builds: public items only, so a link to a private item fails here and not above.
      - name: Rustdoc as docs.rs builds it
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc -p honig --no-deps --all-features --locked
          cargo doc -p cargo-honig --no-deps --locked
      - name: Install mdbook
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: mdbook
      - name: Build the book
        run: mdbook build docs/book

  # Each runtime feature alone and no features. `--workspace` turns on every feature that the e2e crate asks for. So only
  # this job finds a missing `cfg` or a test without the feature that it needs. Three shards split the features.
  features-shard:
    name: features (${{ matrix.partition }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [1/3, 2/3, 3/3]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "stable"
          components: clippy
      # One cache each: rust-cache keys on the job and not on the shard.
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.partition }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-hack and cargo-nextest
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-hack,cargo-nextest
      # The clippy job runs every feature together.
      - name: Clippy, each runtime feature
        env:
          PARTITION: ${{ matrix.partition }}
        run: cargo hack clippy -p honig --each-feature --exclude-all-features --partition "$PARTITION" --all-targets --locked -- -D warnings
      - name: Test, each runtime feature
        env:
          PARTITION: ${{ matrix.partition }}
        run: cargo hack nextest run -p honig --each-feature --partition "$PARTITION" --locked

  # The generator with only the runtime features that it asks for itself. In `--workspace` the e2e crate turns on more
  # (`regress`), so a check the CLI cannot run still passes there. Its own target directory keeps the unified build's
  # artifacts out. The fuzz and coverage tests do not depend on features: the test job runs them.
  generator:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "stable"
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-nextest
      - name: Test the generator alone
        run: cargo nextest run -p cargo-honig --locked --target-dir target/isolated -E 'not test(/fuzz|coverage/)'
      # The generator without its HTTPS client and overlays.
      - name: Test the generator without default features
        run: cargo nextest run -p cargo-honig --lib --no-default-features --locked --target-dir target/isolated -E 'not test(/fuzz|coverage/)'

  # The required check: it fails if a shard failed or did not finish.
  features:
    needs: [features-shard, generator]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.features-shard.result }}
          GENERATOR: ${{ needs.generator.result }}
        run: |
          echo "shards: $SHARDS generator: $GENERATOR"
          [ "$SHARDS" = success ] && [ "$GENERATOR" = success ]

  # The oldest Rust the published crates build with: `rust-version` in Cargo.toml.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain Cargo.toml names
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "cargo-honig") | .rust_version')
          rustup toolchain install "$version" --profile minimal
          echo "MSRV=$version" >> "$GITHUB_ENV"
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check
        run: cargo "+$MSRV" check -p cargo-honig -p honig --all-features --locked

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "stable"
          # `wasm_client` checks the browser client compiles for wasm32.
          targets: wasm32-unknown-unknown
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-nextest
      - name: Test
        run: cargo nextest run --workspace --locked --run-ignored all
      - name: Doctests
        run: cargo test --workspace --doc --locked

  # The scaling benches fail when a path costs more than n^1.3. They count instructions under callgrind, so their
  # counts are the same on every run. The time bench races generated paths against hand-rolled axum baselines:
  # `tests/e2e/benches/time.rs`. The roundtrip bench races the generated client and server against hand-rolled ones:
  # `tests/e2e/benches/roundtrip.rs`. Each bench builds in release, so a pull request runs it only when it changes what
  # that bench measures, `Cargo.toml` or `Cargo.lock`.
  benches:
    name: bench (${{ matrix.bench }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - bench: scaling-runtime
            paths: runtime benches tests/bench-support :!runtime/tests
            valgrind: true
            run: cargo bench -p honig --bench scaling --features cookie,multipart,server,xml --locked
          - bench: scaling-generator
            paths: src benches tests/bench-support :!src/tests :!src/tests.rs
            valgrind: true
            run: cargo bench -p cargo-honig --bench scaling --locked
          # Decoding into generated types: the code that the generator writes, run on bodies that grow.
          - bench: scaling-e2e
            paths: runtime src tests/e2e tests/bench-support :!runtime/tests :!src/tests :!src/tests.rs :!tests/e2e/tests
            valgrind: true
            run: cargo bench -p e2e --bench scaling --locked
          # The time and the peak heap of each kind of request, one build for both.
          - bench: time
            paths: runtime/src src/emit tests/e2e
            valgrind: false
            run: cargo bench -p e2e --bench time --bench memory --locked
          - bench: roundtrip
            paths: runtime/src src/emit tests/e2e
            valgrind: false
            run: cargo bench -p e2e --bench roundtrip --locked
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check what changed
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PATHS: ${{ matrix.paths }}
        run: |
          # shellcheck disable=SC2086 # PATHS is a list of paths.
          if [ "$EVENT" = pull_request ] && git diff --quiet "origin/$BASE_REF...HEAD" -- $PATHS Cargo.toml Cargo.lock; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust toolchain
        if: steps.changed.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "stable"
      # One cache each: rust-cache keys on the job and not on the bench.
      # The packages of valgrind are cached beside the target: the mirror is slow, and drops the version of libc6-dbg
      # that the runner's libc needs.
      - name: Cache cargo registry and target
        if: steps.changed.outputs.run == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.bench }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-directories: ${{ matrix.valgrind && '~/valgrind-debs' || '' }}
      # The runner's package index can list packages that the mirror has dropped, so it is updated first (about 5 s).
      # apt then uses the cached packages and downloads only what the image moved past. needrestart would scan and
      # restart services after libc6 is upgraded: nothing here needs that.
      - name: Install valgrind
        if: steps.changed.outputs.run == 'true' && matrix.valgrind
        run: |
          mkdir -p ~/valgrind-debs/partial
          # `_apt` cannot enter the home folder, so apt downloads as root. The archive drops connections at times.
          apt_opts=(-o APT::Sandbox::User=root -o Acquire::Retries=5)
          sudo apt-get update -qq "${apt_opts[@]}"
          sudo NEEDRESTART_SUSPEND=1 apt-get install -y --no-install-recommends "${apt_opts[@]}" \
            -o Dir::Cache::Archives="$HOME/valgrind-debs" valgrind
          # The cache keeps the packages only: apt's lock and its partial downloads are root's, and tar, run as the
          # runner, cannot open them. Unreadable, they fail the save of the whole cache, cargo's included.
          sudo rm -rf ~/valgrind-debs/partial ~/valgrind-debs/lock
          sudo chown -R "$USER" ~/valgrind-debs
      # What the last run on main measured, for the tables to show beside this run (`tests/bench-support/src/results.rs`).
      # Each run on main saves its own; the newest is restored.
      - name: Restore the results of main
        if: steps.changed.outputs.run == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bench-results
          key: bench-results-${{ matrix.bench }}-${{ github.sha }}
          restore-keys: bench-results-${{ matrix.bench }}-
      - name: Bench
        if: steps.changed.outputs.run == 'true'
        env:
          RUN: ${{ matrix.run }}
        run: $RUN
      # Only main saves: a pull request compares with main and leaves nothing behind.
      - name: Save the results of main
        if: steps.changed.outputs.run == 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bench-results
          key: bench-results-${{ matrix.bench }}-${{ github.sha }}

  # The required check: it fails if a bench failed or did not finish.
  bench:
    needs: benches
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every bench passed
        env:
          RESULT: ${{ needs.benches.result }}
        run: |
          echo "benches: $RESULT"
          [ "$RESULT" = success ]

  deny:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3

  workflows:
    name: Check workflows
    runs-on: ubuntu-latest
    env:
      ACTIONLINT: v1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: zizmor
      - name: Install actionlint
        run: |
          curl -fsSLo actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/$ACTIONLINT/actionlint_${ACTIONLINT#v}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  actionlint.tgz" | sha256sum -c
          tar xzf actionlint.tgz actionlint
      - name: Run actionlint and zizmor
        run: |
          ./actionlint
          zizmor --offline .
