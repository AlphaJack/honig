name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - name: Check conventional PR title
        uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            chore
          scopes: |
            cli
            generator
            runtime
          # An imperative verb first: not an article, not "adds", "added" or "adding".
          subjectPattern: ^(?!(?:a|an|the|this|that|each|every|all|no|one)\s)(?![a-z]*[^su]s\s)(?![a-z]{3,}ing\s)(?![a-z]+[^eb]ed\s)[a-z]+\s.+$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase imperative verb, such as "add typed links".
      - name: Check that a breaking title and a BREAKING CHANGE line come together
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          breaking_title=false
          if printf '%s' "$TITLE" | grep -Eq '^[a-z]+(\([a-z]+\))?!:'; then breaking_title=true; fi
          breaking_body=false
          if printf '%s\n' "$BODY" | grep -Eq '^BREAKING CHANGE: .+'; then breaking_body=true; fi
          if [ "$breaking_title" = true ] && [ "$breaking_body" = false ]; then
            echo "::error::The title has \`!\`: end the body with a line \`BREAKING CHANGE: <what users must do>\`."
            exit 1
          fi
          if [ "$breaking_title" = false ] && [ "$breaking_body" = true ]; then
            echo "::error::The body has a \`BREAKING CHANGE:\` line: add \`!\` after the type or scope of the title."
            exit 1
          fi
