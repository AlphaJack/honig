[package]
name = "honig"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The runtime dependency of code generated by `cargo-honig`: HTTP adapters, routing, authentication and codecs."
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/honig"
keywords = ["openapi", "codegen", "runtime", "http", "serde"]
categories = ["web-programming::http-server", "web-programming::http-client", "encoding"]
include = ["/src/**/*.rs", "/README.md", "/LICENSE", "/Cargo.toml"]

[lints]
workspace = true

[dependencies]
# Integers as text without a heap allocation.
itoa = "1"
serde = { version = "1", features = ["derive"] }
# `raw_value`: a `format: decimal` number parses and writes its exact digits (`Decimal`).
# `float_roundtrip`: a float parses back as the same `f64`. Without it the last digit can move (2.598486701473248e-187
# became 2.5984867014732485e-187), and a body passed on would carry other numbers than it got.
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
# `pkce`: the `S256` challenge.
sha2 = { version = "0.11", optional = true, default-features = false }
percent-encoding = "2.3"
form_urlencoded = "1.2"
# `Cookie` parameters and API keys.
cookie = { version = "0.18", optional = true, default-features = false }
# XML bodies and parts.
quick-xml = { version = "0.42", optional = true }
# `multipart/form-data` bodies.
multer = { version = "3.1", optional = true }
# Bodies and items that arrive or leave a piece at a time are a `Stream`.
futures-core = { version = "0.3", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# `multipart/mixed` boundaries and stream framing. multer does not parse these boundaries (parts without headers).
memchr = "2"
# `Source::unfold` keeps the step it runs inside itself: polled in place, no box per item.
pin-project-lite = "0.2"
reqwest = { version = "0.13", optional = true, default-features = false }
reqwest-middleware = { version = "0.5", optional = true }
ureq = { version = "3", optional = true, default-features = false }
# `format: byte`, base64 parts, Basic auth and PKCE. `simd` keeps only `base64url` here.
base64 = { version = "0.23", optional = true, default-features = false, features = ["std"] }
# `Blob::Bytes`: clones share one buffer. A transport sends it without a copy.
bytes = "1.10"
axum = { version = "0.8", optional = true, default-features = false }
http = "1"
# `server`: a tower `Service` over `http` requests. hyper and axum serve it as it is. `client`: a
# transport over any such `Service`.
http-body = "1"
tower-service = { version = "0.3", optional = true }
tower-layer = { version = "0.3", optional = true }
tracing = { version = "0.1", optional = true, default-features = false, features = ["std"] }
# `traceparent` and `tracestate`: the OpenTelemetry span context of a `tracing` span.
opentelemetry = { version = "0.33", optional = true, default-features = false, features = ["trace"] }
tracing-opentelemetry = { version = "0.34", optional = true, default-features = false }
# The types of string formats. Generated code refers to them through the runtime.
jiff = { version = "1", optional = true, default-features = false, features = ["std", "serde"] }
uuid = { version = "1", optional = true, features = ["serde"] }
url = { version = "2", optional = true, features = ["serde"] }
ipnet = { version = "2", optional = true, features = ["serde"] }
# `email`, `idn-email`, `hostname` and `idn-hostname` checks: IDNA2008 and punycode.
idna = { version = "1", optional = true }
# The general category of a code point (RFC 5892 section 2.1). `idna` depends on it already.
icu_properties = { version = "2", optional = true }
# `pattern` checks: ECMA-262 as JSON Schema interprets it.
regress = { version = "0.12", optional = true }
# `simd`: SIMD JSON, UTF-8 and base64. serde_json still reports where a body that fails to
# decode is wrong. sonic-rs has SIMD on x86_64 and aarch64 only. Elsewhere JSON stays on serde_json.
simdutf8 = { version = "0.1", optional = true }
base64-simd = { version = "0.8", optional = true }

[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
# 0.5.11: the depth limit fits a 2 MiB stack in debug builds too (cloudwego/sonic-rs#267).
sonic-rs = { version = "0.5.11", optional = true }

# wasm32 receives reqwest responses through `bytes_stream`.
# `Pkce::new`: a verifier from OS randomness. wasm32 has none without configuration: a browser passes its own to
# `Pkce::from_verifier`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { version = "0.4", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", optional = true, default-features = false, features = ["stream"] }
# The wait before an event stream reconnects.
gloo-timers = { version = "0.4", features = ["futures"] }
# `GlooTransport`: browser `fetch` and its response body as a `ReadableStream`.
gloo-net = { version = "0.8", optional = true, default-features = false, features = ["http"] }
web-sys = { version = "0.3", optional = true, default-features = false, features = ["ReadableStream", "ReadableStreamDefaultReader", "ReadableStreamReadResult"] }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

# A `##` comment documents the feature below it. A test turns them into the table in the book. The table also says
# when generated code needs each one (`settings::FEATURES` in the generator).
[features]
## The generated client: the `Transport` bound over tower services and `TowerTransport`
client = ["dep:tower-service"]
## The generated server: a tower `Service`, routing, conditional requests and the wide event
server = ["dep:tower-service", "dep:tower-layer"]
## `ReqwestTransport`: async client with streaming bodies
reqwest = ["client", "dep:reqwest"]
## `ReqwestMiddlewareTransport`: retries, tracing and caching from your middleware stack
reqwest-middleware = ["reqwest", "dep:reqwest-middleware"]
## `UreqTransport`: blocking client
ureq = ["client", "dep:ureq"]
## `GlooTransport`: browser `fetch` on `wasm32` only
gloo-net = ["client", "dep:gloo-net", "dep:web-sys", "dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures"]
## `Server::into_axum` and the address of the client from the `ConnectInfo` of axum
# `tokio`: `ConnectInfo`. `axum::serve` puts the address of the client there.
axum = ["server", "dep:axum", "axum/tokio"]
## A span per request and a log line for each wide event
tracing = ["server", "dep:tracing"]
## W3C Trace Context: `traceparent` and `tracestate`
tracing-opentelemetry = ["dep:opentelemetry", "dep:tracing-opentelemetry", "dep:tracing"]
## `date-time`, `date`, `date-time-local` and `time-local` as `jiff` types, and `FullTime` in them
jiff = ["dep:jiff"]
## `uuid` as `uuid::Uuid`
uuid = ["dep:uuid"]
## `uri` as `url::Url`
url = ["dep:url"]
## `ipv4-cidr` and `ipv6-cidr` as `ipnet` networks
ipnet = ["dep:ipnet"]
## `email`, `idn-email`, `hostname` and `idn-hostname` checks
idn = ["dep:idna", "dep:icu_properties"]
## `pattern` and `patternProperties` checks (ECMA-262)
regress = ["dep:regress"]
## The `OAuth` 2.0 flows of the client: token grants, device authorization and discovery
oauth = ["client", "base64"]
## `Pkce`, `authorization_url` and `exchange_code`: the OAuth 2.0 authorization code flow. Outside wasm32 `Pkce::new` makes a verifier from OS randomness
pkce = ["oauth", "dep:sha2", "dep:getrandom"]
## `Cookie` parameters and API keys
cookie = ["dep:cookie"]
## `multipart/*` bodies and parts
multipart = ["base64", "dep:multer"]
## Binary data in JSON (`format: byte`, `contentEncoding`, `base64url`) and `http basic` credentials
base64 = ["dep:base64"]
## XML bodies and parts
xml = ["dep:quick-xml"]
## SIMD for large bodies: JSON with `sonic-rs` (x86_64 and aarch64), the UTF-8 check of text with `simdutf8` and base64 with `base64-simd`. Multipart boundaries use `memchr` with or without it
simd = ["base64", "dep:sonic-rs", "dep:simdutf8", "dep:base64-simd"]

[package.metadata.docs.rs]
all-features = true

# `tests/clients.rs`: reqwest needs a tokio runtime to send on.
[dev-dependencies]
# `assert_matches!`: the macro of std is unstable at the oldest Rust supported.
assert_matches = "1"
# The paths the benches time and the callgrind check of how they scale.
bench-support = { path = "../tests/bench-support" }
tokio = { version = "1", features = ["rt-multi-thread"] }
divan = "0.1"
# `service_fn`: a server in memory that a client sends to.
tower = { version = "0.5", default-features = false, features = ["util"] }

[[test]]
name = "arriving"
required-features = ["client"]

[[test]]
name = "event_stream"
required-features = ["client"]

[[test]]
name = "codecs"
required-features = ["cookie", "multipart", "xml"]

[[test]]
name = "format_checks"
required-features = ["idn"]

[[test]]
name = "xml_memory"
required-features = ["xml"]

[[bench]]
name = "codecs"
harness = false
required-features = ["cookie", "multipart", "xml"]

[[bench]]
name = "scaling"
harness = false
required-features = ["cookie", "multipart", "server", "xml"]

[[bench]]
name = "formats"
harness = false
required-features = ["idn"]

[[bench]]
name = "simd"
harness = false
required-features = ["multipart"]

[[bench]]
name = "unions"
harness = false

