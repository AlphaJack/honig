[workspace]
git_only = true
git_tag_enable = false
git_release_enable = false
changelog_update = false
# The library's API: a breaking change bumps the version accordingly.
semver_check = true
# Chores and docs alone open no release PR.
release_commits = "^(feat|fix|perf)"
# The default title has a scope that pr-title.yml rejects.
pr_name = "chore: release v{{ version }}"
# One tag for the version group. Without it release-plz looks for `honig-v<version>`, finds none and releases again.
git_tag_name = "v{{ version }}"
# crates.yml publishes once dist has built every target.
publish = false

# Generated code pins the runtime to the generator's own version: they are released together.
[[package]]
name = "cargo-honig"
version_group = "honig"
git_tag_enable = true
git_release_enable = true
git_release_name = "v{{ version }}"
# dist uploads the binaries to the draft and then publishes it.
git_release_draft = true
changelog_update = true
changelog_path = "CHANGELOG.md"
changelog_include = ["honig"]

[[package]]
name = "honig"
version_group = "honig"

[[package]]
name = "e2e"
release = false

[[package]]
name = "bench-support"
release = false

# Its version is 0.0.0. Released, it would leave `{{ version }}` in `pr_name` undefined.
[[package]]
name = "shop"
release = false

[changelog]
commit_preprocessors = [
    # The scope `codegen` became `generator`: commits from before read the same as those after.
    { pattern = '^([a-z]+)\(codegen\)', replace = "${1}(generator)" },
    # "Validate" describes what a request goes through: #42 and #43 read the same as the commits after them.
    { pattern = ': check the (address of a CIDR block|text of a library type)', replace = ": validate the ${1}" },
    # The default of release-plz, which a list of our own replaces: each `(#N)` links its pull request.
    { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/AlphaJack/honig/pull/${1}))" },
]
header = """
# Changelog

"""
# Each group lists its commits under a heading per scope, Runtime, Generator then CLI, breaking ones first.
# Commits with no listed scope come before the headings. The comment before each group name sets the order of the
# groups, which would otherwise be alphabetical.
body = """
{%- set scopes = ["runtime", "generator", "cli"] %}
## [{{ version }}]{%- if release_link -%}({{ release_link }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for c in commits %}{% if c.scope not in scopes %}
- {% if c.scope %}**{{ c.scope }}**: {% endif %}{% if c.breaking %}**Breaking:** {% endif %}{{ c.message | upper_first }}
{%- endif %}{% endfor %}
{%- for scope in scopes %}{% set scoped = commits | filter(attribute="scope", value=scope) %}{% if scoped %}

#### {% if scope == "cli" %}CLI{% else %}{{ scope | upper_first }}{% endif %}
{% for c in scoped | filter(attribute="breaking", value=true) %}
- **Breaking:** {{ c.message | upper_first }}
{%- endfor %}
{%- for c in scoped | filter(attribute="breaking", value=false) %}
- {{ c.message | upper_first }}
{%- endfor %}
{%- endif %}{% endfor %}
{% endfor %}
"""
# The template leaves two blank lines where a group has no commit outside the listed scopes.
postprocessors = [{ pattern = '\n{3,}', replace = "\n\n" }]
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->added" },
    { message = "^fix", group = "<!-- 1 -->fixed" },
    { message = "^perf", group = "<!-- 2 -->optimized" },
    # Users do not see other types unless they break something.
    { message = "^[a-z]+(\\([^)]*\\))?!:", group = "<!-- 3 -->changed" },
    { message = ".*", skip = true },
]
