# ANCHOR: all
openapi: 3.2.0
info:
  title: Catalog
  version: 1.0.0
servers:
  - url: https://shop.example.com/v1
security:
  - apiKey: []
paths:
  /products:
    get:
      operationId: listProducts
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            maximum: 100
        - name: tags
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: A page of products
          headers:
            X-Next:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createProduct
      parameters:
        - name: notify
          in: query
          description: Where to send the new product
          schema:
            type: string
            format: uri
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '403':
          description: The caller is not staff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      # ANCHOR: callback
      callbacks:
        productCreated:
          '{$request.query.notify}':
            post:
              requestBody:
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/Product'
              responses:
                '204':
                  description: Received
      # ANCHOR_END: callback
  # ANCHOR: media
  /products/export:
    get:
      operationId: exportProducts
      responses:
        '200':
          description: Every product, as JSON or as CSV
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
            text/csv:
              schema:
                type: string
  # ANCHOR_END: media
  # ANCHOR: stream
  /products/events:
    get:
      operationId: streamProductEvents
      responses:
        '200':
          description: Each change to the catalog as it happens
          content:
            text/event-stream:
              itemSchema:
                $ref: '#/components/schemas/ProductEvent'
        '204':
          description: The feed has ended
  # ANCHOR_END: stream
  /products/{productId}:
    get:
      operationId: getProduct
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        # ANCHOR: not-modified
        - name: If-None-Match
          in: header
          schema:
            type: string
        # ANCHOR_END: not-modified
      responses:
        '200':
          description: A product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          # ANCHOR: links
          links:
            DeleteProduct:
              operationId: deleteProduct
              parameters:
                productId: $request.path.productId
          # ANCHOR_END: links
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    # ANCHOR: delete
    delete:
      operationId: deleteProduct
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    # ANCHOR_END: delete
  /products/{productId}/photo:
    # ANCHOR: photo-get
    get:
      operationId: getProductPhoto
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The photo of the product, in whatever image format it was uploaded
          headers:
            ETag:
              schema:
                type: string
          content:
            image/*: {}
        '404':
          description: No photo
    # ANCHOR_END: photo-get
    # ANCHOR: photo-put
    put:
      operationId: putProductPhoto
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: If-Match
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          image/*: {}
      responses:
        '204':
          description: Stored
        '404':
          description: No such product
        '412':
          description: The photo changed since the client read it
    # ANCHOR_END: photo-put
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Product:
      oneOf:
        - $ref: '#/components/schemas/Physical'
        - $ref: '#/components/schemas/Digital'
      discriminator:
        propertyName: kind
        mapping:
          physical: '#/components/schemas/Physical'
          digital: '#/components/schemas/Digital'
    # Each branch fixes its tag, so a value matches exactly one: `oneOf` is satisfied whatever the discriminator says.
    # ANCHOR: physical
    Physical:
      type: object
      required:
        - kind
        - name
      properties:
        kind:
          const: physical
        name:
          type: string
        fragile:
          type: boolean
        sku:
          type: string
          pattern: '^[A-Z]{3}-[0-9]{4}$'
          description: Stock keeping unit
    # ANCHOR_END: physical
    Digital:
      type: object
      required:
        - kind
        - name
      properties:
        kind:
          const: digital
        name:
          type: string
        downloads:
          type:
            - integer
            - "null"
          format: int32
    # ANCHOR: product-event
    ProductEvent:
      type: object
      required:
        - event
        - product
      properties:
        event:
          type: string
          enum:
            - created
            - deleted
        product:
          $ref: '#/components/schemas/Product'
    # ANCHOR_END: product-event
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
# ANCHOR_END: all
