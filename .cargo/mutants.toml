# A mutant of the generator or the runtime runs every package's tests: `tests/e2e` exercises both.
test_workspace = true

# Not the generated code of `tests/e2e` and `examples/shop`: an edit to it is stale, so `tests/regen.rs` catches
# every mutant of it.
examine_globs = ["src/**", "honig/src/**"]

# Mutants go to the shards one by one. Then the shards finish together.
sharding = "round-robin"

# A mutant whose build lasts three times as long as the unmutated one is stopped. Such a build does not end: a loop in a
# `const fn` that never stops runs at compile time.
build_timeout_multiplier = 3.0

# Code behind a feature that no workspace member turns on (`ipnet`, `ureq`, `reqwest-middleware`) is built and tested.
all_features = true

# Built only for wasm32. The runner never compiles them, so every mutant is missed. The same for the engines that
# `simd` replaces.
exclude_globs = [
  "honig/src/client/adapters/gloo.rs",
  "honig/src/client/adapters/reqwest/wasm.rs",
  "honig/src/transport/wasm.rs",
  "honig/src/json/plain.rs",
]

# Mutants that change nothing a test can see.
exclude_re = [
  # A string or integer `enum` is a typed enum, which ignores a JSON comparison of its values: `untyped_values` may
  # call it untyped either way.
  'src/ir/types/build/keywords\.rs:(489:\d+: replace && with \|\||496:\d+: replace && with \|\|) in untyped_values$',
  # The hop bound of `needs_checks` and `json_held_by_type`: `break_cycles` has made every alias in a loop a newtype
  # before `checked::wrap` and the emitter run, so no alias chain reaches it.
  'src/ir/checked\.rs:\d+:\d+: replace (match guard hops < MAX_ALIAS_HOPS with true|< with <=|\+ with \*) in (needs_checks|json_held_by_type)$',
  # `Debug` output and serde's `expecting` text.
  'impl (std::)?fmt::Debug for ',
  '>::expecting -> ',
  # A hint: callers must work with any value.
  '::size_hint -> Option<usize>',
  # Forwards to the wrapped serializer. No format of the runtime uses it.
  'honig/src/(finite|path|integral|no_seq)\.rs:.*is_human_readable',
  'honig/src/path\.rs:\d+:\d+: replace <impl de::VariantAccess<.*>::unit_variant -> ',
  # Needs a server on the network. The build without `remote-refs` is not mutated.
  'src/resolve\.rs:.*replace download -> ',
  # The 16 MiB default of `max_body_bytes`.
  'honig/src/reject\.rs:\d+:\d+: replace \* with \+$',
  # The same pass walks and hoists what adoption brought in. Another pass after adoption alone finds nothing.
  'src/resolve\.rs:\d+:\d+: replace \|\| with && in bundle_with$',
  # A fragment that is empty or a pointer finds no anchor either way.
  'src/resolve\.rs:\d+:\d+: replace && with \|\| in fetch$',
  # When a decoder drops the records it returned. Later only costs memory.
  'honig/src/stream\.rs:\d+:\d+: replace (/ with \*|> with <|> with >=) in Decoder<T>::poll_item$',
  # One more item in a piece of a streamed body. The bytes are the same.
  'honig/src/stream\.rs:319:\d+: replace < with <= in ',
  # Three bytes contain no whole event: waiting for a fourth changes nothing.
  'honig/src/stream\.rs:872:\d+: replace < with <= in ',
  # `eol + 1` and `eol * 1`: past the line break either way.
  'honig/src/stream\.rs:(930:34|948:37): replace \+ with \* in ',
  # The base64 engine without `simd`. The build has `simd` on.
  'honig/src/base64\.rs:(2[4-9]|3\d|4[0-4]):',
  # `from_str` checks what the guard checks: the guard only saves the check.
  'honig/src/header\.rs:\d+:\d+: replace (match guard .* with false|\|\| with &&) in header_value$',
  # Pieces joined early decode to the same bytes. The capacity is a hint.
  'honig/src/base64\.rs:\d+:\d+: replace && with \|\| in decode_pieces$',
  'honig/src/base64\.rs:\d+:\d+: replace [/*] with [-+*/%] in unbase64_mime$',
  # A month that does not exist has 0 days: no day is in `1..=0` either way.
  'honig/src/formats\.rs:\d+:\d+: replace > with >= in is_date$',
  # An ASCII character that the arm before refused is no `ucschar` or `iprivate` either.
  'honig/src/uri\.rs:\d+:\d+: replace match guard !c\.is_ascii\(\) with true in all$',
  # serde_json refuses an optional map key itself.
  'honig/src/unique_keys\.rs:\d+:\d+: replace <impl Serializer for KeyText>::serialize_some -> ',
  # Text that does not start with `[` parses to no array: the guard only saves the parse.
  'honig/src/coerce\.rs:\d+:\d+: replace match guard s\.trim_start\(\)\.starts_with\(.*\) with true ',
  # `None` and the error both send the value down the `Value` path.
  'honig/src/scalar\.rs:\d+:\d+: replace <impl Serializer for ScalarText>::serialize_(bytes|newtype_variant) -> .* with Ok\(None\)$',
  'honig/src/scalar\.rs:\d+:\d+: replace <impl fmt::Display for NotScalar>::fmt ',
  # A leading comma on both sides: the text is still the same for equal values only.
  'honig/src/checks\.rs:\d+:\d+: replace > with >= in canonical$',
  # A field comes once: no two fields of a body have one index in the shape.
  'honig/src/xml_tree/encode\.rs:\d+:\d+: replace > with >= in after$',
  # One text field per shape: the text is written in order or not streamed, with the same bytes.
  'honig/src/xml_tree/encode\.rs:421:42: delete ! in ',
  # An inline object writes neither its attributes nor the properties that its shape does not list.
  'honig/src/xml_tree/encode\.rs:\d+:\d+: replace match guard self\.inline( && f\.attribute)? with false in ',
  # `Ok(())` already, and a stop that no caller writes out.
  'honig/src/xml_tree/encode\.rs:\d+:\d+: replace <impl SerializeSeq for Items<.*>::end -> Result with Ok\(Default',
  'honig/src/xml_tree/encode\.rs:\d+:\d+: replace <impl fmt::Display for Stop>::fmt ',
  # CDATA without a `\r` has nothing to normalize: the owned copy contains the same text.
  'honig/src/xml/stream\.rs:\d+:\d+: replace match guard c\.contains\(.\\r.\) with true in ',
  # A shape of 128 fields or more: none is that big.
  'honig/src/xml/stream\.rs:\d+:\d+: replace < with <= in Seen::bit$',
  # Members of an object start with a quoted key: without commas the text still tells them apart.
  'honig/src/checks\.rs:447:\d+: replace > with (<|==) in canonical$',
  'honig/src/checks\.rs:513:\d+: replace > with (<|==|>=) in canonical_content$',
]
