allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
too-many-lines-threshold = 80
disallowed-types = [
  { path = "std::collections::HashMap", reason = "use BTreeMap or Vec: generated code must not depend on hash order" },
  { path = "std::collections::HashSet", reason = "use BTreeSet or Vec: generated code must not depend on hash order" },
]
disallowed-methods = [
  { path = "std::thread::sleep", reason = "use condition-based waits" },
  # Generated code is built as syntax trees (`quote!`, `syntax::lit` and `syntax::ident`). It is never built from strings.
  { path = "core::str::FromStr::from_str", reason = "build tokens with quote!, never from strings" },
  { path = "syn::parse_str", reason = "build syntax trees with quote!, never from strings" },
  { path = "syn::parse_file", reason = "build syntax trees with quote!, never from strings" },
  # Passes take values and return values. Only the edge reads and writes files, the environment and processes.
  { path = "std::process::Command::new", reason = "honig runs no programs" },
  { path = "std::env::var", reason = "configuration comes from Cargo.toml and the command line" },
  { path = "std::env::var_os", reason = "configuration comes from Cargo.toml and the command line" },
  { path = "std::fs::read", reason = "only the edge touches files" },
  { path = "std::fs::read_to_string", reason = "only the edge touches files" },
  { path = "std::fs::write", reason = "only the edge touches files" },
  { path = "std::fs::copy", reason = "only the edge touches files" },
  { path = "std::fs::metadata", reason = "only the edge touches files" },
  { path = "std::fs::create_dir_all", reason = "only the edge touches files" },
  { path = "std::fs::remove_file", reason = "only the edge touches files" },
  { path = "std::fs::remove_dir_all", reason = "only the edge touches files" },
  { path = "std::fs::rename", reason = "only the edge touches files" },
  { path = "std::fs::read_dir", reason = "only the edge touches files" },
  { path = "std::fs::File::open", reason = "only the edge touches files" },
  { path = "std::fs::File::create", reason = "only the edge touches files" },
  { path = "std::path::Path::is_file", reason = "only the edge touches files" },
  { path = "std::path::Path::is_dir", reason = "only the edge touches files" },
  { path = "std::path::Path::exists", reason = "only the edge touches files" },
  { path = "std::path::Path::canonicalize", reason = "only the edge touches files" },
  { path = "std::fs::canonicalize", reason = "only the edge touches files" },
]

doc-valid-idents = ["OpenAPI", ".."]
